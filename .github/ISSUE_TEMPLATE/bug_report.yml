name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LinkXOrbit version
      placeholder: "1.2.1"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Grow network
        - Unfollow – Followers list
        - Unfollow – Following list
        - Not related to a run
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Activity log
      description: Click **Copy** on the Activity log page and paste here.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot of the LinkedIn window where it got stuck, if any.
