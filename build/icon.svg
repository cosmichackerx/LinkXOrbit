<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1877d6"/>
      <stop offset="1" stop-color="#0a3f86"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe5ff"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" rx="112" fill="#ffffff" opacity="0.06"/>
  <g transform="rotate(-32 256 256)">
    <!-- back half of orbit -->
    <path d="M60 256 A196 78 0 0 1 452 256" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- planet with X -->
  <circle cx="256" cy="256" r="96" fill="url(#core)"/>
  <path d="M218 218 L294 294 M294 218 L218 294" stroke="#0a66c2" stroke-width="26" stroke-linecap="round"/>
  <g transform="rotate(-32 256 256)">
    <!-- front half of orbit -->
    <path d="M452 256 A196 78 0 0 1 60 256" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="452" cy="256" r="30" fill="#5ce1a0" stroke="#0a3f86" stroke-width="8"/>
  </g>
</svg>
